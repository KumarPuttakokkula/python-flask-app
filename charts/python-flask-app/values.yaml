replicaCount: 1
image:
  repository: kumar2021/python-flask-app
  pullPolicy: Always
  tag: "f71335"
imagePullSecrets:
  - name: dockerhub-cred
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 5000
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: python-flask-app.test.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
livenessProbe:
  httpGet:
    path: /app/v1/healthz
    port: http
  initialDelaySeconds: 2
  failureThreshold: 5
  periodSeconds: 2
readinessProbe:
  httpGet:
    path: /app/v1/healthz
    port: http
  initialDelaySeconds: 2
  failureThreshold: 5
  periodSeconds: 2
startupProbe:
  httpGet:
    path: /app/v1/healthz
    port: http
  initialDelaySeconds: 2
  failureThreshold: 30
  periodSeconds: 2
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
